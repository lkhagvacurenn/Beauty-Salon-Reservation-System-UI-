<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF9FA">
  <title>Платформын удирдлага · Beauty Salon UI</title>
  <link rel="icon" type="image/png" href="../assets/logo/logo-symbol.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-base="../">
  <!-- Pages: one <section data-page="id"> per menu item.
       Each page is rendered by its script in assets/js/admin/. -->
  <div id="pages">
    <section data-page="dashboard"></section>
    <section data-page="users"></section>
    <section data-page="salons"></section>
    <section data-page="bookings"></section>
    <section data-page="reviews"></section>
    <section data-page="ads"></section>
    <section data-page="invoices"></section>
  </div>

  <script>
    window.APP = {
      id: "admin", kind: "dashboard", title: "Platform Administration · Платформын удирдлага", phase: 5,
      user: { name: "Админ Бат-Очир", role: "Платформын удирдлага", initials: "БО" },
      nav: [
        { id: "dashboard", label: "Хяналтын самбар",      icon: "layout-dashboard", group: "Ерөнхий" },
        { id: "users",     label: "Хэрэглэгчид",          icon: "users",            group: "Ерөнхий" },
        { id: "salons",    label: "Салон батлах",         icon: "badge-check",      group: "Хяналт" },
        { id: "bookings",  label: "Захиалга ба төлбөр",   icon: "calendar-search",  group: "Хяналт" },
        { id: "reviews",   label: "Сэтгэгдэл хянах",      icon: "message-square-warning", group: "Хяналт" },
        { id: "ads",       label: "Сурталчилгаа",         icon: "megaphone",        group: "Контент" },
        { id: "invoices",  label: "Шимтгэл ба нэхэмжлэх", icon: "receipt",          group: "Санхүү" }
      ]
    };
  </script>
  <script src="../assets/vendor/lucide.min.js"></script>
  <script src="../assets/js/ui.js"></script>
  <!-- Shared demo data + engine. The admin reads the business owner's
       store too, so reports, invoices and the fee rule stay in sync. -->
  <script src="../assets/js/client/data.js"></script>
  <script src="../assets/js/client/data-extra.js"></script>
  <script src="../assets/js/client/engine.js"></script>
  <script src="../assets/js/business/biz-data.js"></script>
  <script src="../assets/js/business/biz-core.js"></script>
  <!-- Admin pages (must load before shell.js) -->
  <script src="../assets/js/admin/adm-data.js"></script>
  <script src="../assets/js/admin/adm-core.js"></script>
  <script src="../assets/js/admin/adm-users.js"></script>
  <script src="../assets/js/admin/adm-salons.js"></script>
  <script src="../assets/js/admin/adm-bookings.js"></script>
  <script src="../assets/js/admin/adm-reviews.js"></script>
  <script src="../assets/js/admin/adm-ads.js"></script>
  <script src="../assets/js/admin/adm-invoices.js"></script>
  <script src="../assets/js/shell.js"></script>
